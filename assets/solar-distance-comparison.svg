<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Distance from the Sun: Solar Shield (L1 swarm) vs SBSP harvester</title>
  <rect width="1000" height="620" fill="#0b0d12"/>

  <!-- Panel 1: true scale -->
  <text x="500" y="40" text-anchor="middle" fill="#e8e6df" font-size="18" font-weight="600">Distance from the Sun — true scale (1 AU = 149.6M km)</text>

  <circle cx="90" cy="140" r="32" fill="#f2a623"/>
  <text x="90" y="196" text-anchor="middle" fill="#f2a623" font-size="13">Sun</text>

  <line x1="140" y1="140" x2="880" y2="140" stroke="#4a4a45" stroke-width="2"/>

  <!-- Earth at true-scale end -->
  <circle cx="880" cy="140" r="9" fill="#378add"/>
  <text x="880" y="172" text-anchor="middle" fill="#a9c7ea" font-size="13">Earth · 149.6M km</text>

  <!-- L1 marker, exaggerated with callout since real offset is invisible at this scale -->
  <circle cx="865" cy="140" r="3" fill="#5dcaa5"/>
  <line x1="865" y1="125" x2="865" y2="80" stroke="#5dcaa5" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="865" y="68" text-anchor="middle" fill="#5dcaa5" font-size="12">L1 (1.5M km sunward)</text>

  <text x="500" y="230" text-anchor="middle" fill="#807e76" font-size="12">Both projects sit within 1% of 1 AU — the real difference is engineering distance, shown below</text>

  <!-- divider -->
  <line x1="60" y1="260" x2="940" y2="260" stroke="#2a2c33" stroke-width="1"/>

  <!-- Panel 2: zoomed Earth-vicinity view -->
  <text x="500" y="300" text-anchor="middle" fill="#e8e6df" font-size="18" font-weight="600">Zoomed view — Earth-Sun line near Earth</text>

  <defs>
    <marker id="arrowSun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f2a623"/>
    </marker>
  </defs>

  <!-- Sun icon, fully drawn and in bounds -->
  <circle cx="70" cy="450" r="24" fill="#f2a623"/>
  <line x1="70" y1="414" x2="70" y2="400" stroke="#f2a623" stroke-width="2" opacity="0.6"/>
  <line x1="45" y1="425" x2="35" y2="415" stroke="#f2a623" stroke-width="2" opacity="0.6"/>
  <line x1="95" y1="425" x2="105" y2="415" stroke="#f2a623" stroke-width="2" opacity="0.6"/>
  <text x="70" y="492" text-anchor="middle" fill="#f2a623" font-size="12">Sun</text>

  <!-- arrow + distance label, anchored start so it never runs off-canvas -->
  <line x1="105" y1="450" x2="160" y2="450" stroke="#f2a623" stroke-width="2" marker-end="url(#arrowSun)"/>
  <text x="115" y="435" text-anchor="start" fill="#f2a623" font-size="11">148.1M km to Sun</text>

  <!-- L1 swarm -->
  <g>
    <circle cx="270" cy="450" r="4" fill="#5dcaa5" opacity="0.9"/>
    <circle cx="285" cy="442" r="3" fill="#5dcaa5" opacity="0.7"/>
    <circle cx="288" cy="460" r="3" fill="#5dcaa5" opacity="0.7"/>
    <circle cx="260" cy="462" r="3" fill="#5dcaa5" opacity="0.7"/>
    <circle cx="278" cy="470" r="2.5" fill="#5dcaa5" opacity="0.6"/>
    <circle cx="255" cy="440" r="2.5" fill="#5dcaa5" opacity="0.6"/>
    <text x="272" y="500" text-anchor="middle" fill="#5dcaa5" font-size="13" font-weight="600">Solar Shield swarm</text>
    <text x="272" y="518" text-anchor="middle" fill="#8fd9bd" font-size="11">L1 · 1.5M km sunward of Earth</text>
    <text x="272" y="534" text-anchor="middle" fill="#8fd9bd" font-size="11">148.1M km from Sun</text>
  </g>

  <!-- Earth -->
  <circle cx="540" cy="450" r="16" fill="#378add"/>
  <text x="540" y="500" text-anchor="middle" fill="#378add" font-size="13" font-weight="600">Earth</text>
  <text x="540" y="518" text-anchor="middle" fill="#a9c7ea" font-size="11">149.6M km from Sun</text>

  <!-- SBSP satellite (GEO, exaggerated separation for visibility) -->
  <g>
    <rect x="700" y="443" width="20" height="14" rx="2" fill="#ef9f27"/>
    <text x="710" y="500" text-anchor="middle" fill="#ef9f27" font-size="13" font-weight="600">SBSP harvester</text>
    <text x="710" y="518" text-anchor="middle" fill="#f4c98a" font-size="11">GEO · 42,164 km from Earth</text>
    <text x="710" y="534" text-anchor="middle" fill="#f4c98a" font-size="11">~149.6M km from Sun</text>
  </g>

  <!-- connecting line earth to sat -->
  <line x1="556" y1="450" x2="698" y2="450" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- delta annotation -->
  <line x1="272" y1="380" x2="540" y2="380" stroke="#5dcaa5" stroke-width="1"/>
  <text x="406" y="370" text-anchor="middle" fill="#5dcaa5" font-size="12">Δ ≈ 1.5 million km closer to the Sun</text>

  <text x="500" y="580" text-anchor="middle" fill="#5f5e5a" font-size="11">Note: L1-Earth and Earth-satellite gaps enlarged for legibility — not to relative scale</text>
</svg>
