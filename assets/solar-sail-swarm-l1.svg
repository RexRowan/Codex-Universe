<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Solar Shield — reflective sail swarm at Sun-Earth L1</title>
  <rect width="900" height="600" fill="#0b0d12"/>

  <text x="450" y="45" text-anchor="middle" fill="#e8e6df" font-size="20" font-weight="600">Solar Shield — reflective swarm concept</text>
  <text x="450" y="68" text-anchor="middle" fill="#807e76" font-size="13">Many gram-scale reflective sails, station-keeping near Sun-Earth L1</text>

  <!-- Sun -->
  <circle cx="90" cy="330" r="42" fill="#f2a623"/>
  <circle cx="90" cy="330" r="52" fill="none" stroke="#f2a623" stroke-width="1" opacity="0.3"/>
  <text x="90" y="400" text-anchor="middle" fill="#f2a623" font-size="13">Sun</text>

  <!-- sunlight rays -->
  <line x1="140" y1="310" x2="330" y2="255" stroke="#f2a623" stroke-width="1" opacity="0.35"/>
  <line x1="140" y1="330" x2="330" y2="300" stroke="#f2a623" stroke-width="1" opacity="0.35"/>
  <line x1="140" y1="350" x2="330" y2="345" stroke="#f2a623" stroke-width="1" opacity="0.35"/>
  <line x1="140" y1="330" x2="330" y2="390" stroke="#f2a623" stroke-width="1" opacity="0.35"/>
  <line x1="140" y1="330" x2="330" y2="435" stroke="#f2a623" stroke-width="1" opacity="0.35"/>

  <!-- L1 swarm cloud -->
  <g>
    <!-- individual sails as tiny squares angled -->
    <g fill="#e1f5ee" stroke="#5dcaa5" stroke-width="0.5">
      <rect x="330" y="230" width="10" height="10" transform="rotate(15 335 235)"/>
      <rect x="355" y="250" width="9" height="9" transform="rotate(-10 359 254)"/>
      <rect x="345" y="270" width="11" height="11" transform="rotate(25 350 275)"/>
      <rect x="370" y="290" width="8" height="8" transform="rotate(5 374 294)"/>
      <rect x="320" y="300" width="10" height="10" transform="rotate(-20 325 305)"/>
      <rect x="360" y="320" width="9" height="9" transform="rotate(30 364 324)"/>
      <rect x="340" y="340" width="11" height="11" transform="rotate(-5 345 345)"/>
      <rect x="375" y="350" width="8" height="8" transform="rotate(18 379 354)"/>
      <rect x="325" y="360" width="10" height="10" transform="rotate(-15 330 365)"/>
      <rect x="355" y="380" width="9" height="9" transform="rotate(10 359 384)"/>
      <rect x="345" y="400" width="11" height="11" transform="rotate(-25 350 405)"/>
      <rect x="370" y="410" width="8" height="8" transform="rotate(8 374 414)"/>
      <rect x="330" y="420" width="10" height="10" transform="rotate(-12 335 425)"/>
      <rect x="380" y="270" width="9" height="9" transform="rotate(20 384 274)"/>
      <rect x="385" y="330" width="10" height="10" transform="rotate(-8 390 335)"/>
      <rect x="380" y="390" width="9" height="9" transform="rotate(15 384 394)"/>
    </g>
    <ellipse cx="355" cy="330" rx="75" ry="115" fill="none" stroke="#5dcaa5" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  </g>

  <text x="355" y="470" text-anchor="middle" fill="#5dcaa5" font-size="13" font-weight="600">L1 sail swarm</text>
  <text x="355" y="488" text-anchor="middle" fill="#8fd9bd" font-size="11">reduces solar flux reaching Earth</text>

  <!-- Earth -->
  <circle cx="720" cy="330" r="26" fill="#378add"/>
  <path d="M700 320 Q715 310 725 322 Q735 315 715 335 Q705 340 700 320" fill="#5dcaa5" opacity="0.5"/>
  <text x="720" y="380" text-anchor="middle" fill="#378add" font-size="13" font-weight="600">Earth</text>

  <!-- reduced sunlight to earth -->
  <line x1="440" y1="300" x2="695" y2="315" stroke="#f2a623" stroke-width="1" opacity="0.2"/>
  <line x1="440" y1="330" x2="695" y2="330" stroke="#f2a623" stroke-width="1" opacity="0.2"/>
  <line x1="440" y1="360" x2="695" y2="345" stroke="#f2a623" stroke-width="1" opacity="0.2"/>

  <!-- distance annotation -->
  <line x1="90" y1="500" x2="355" y2="500" stroke="#5f5e5a" stroke-width="0.5"/>
  <line x1="355" y1="500" x2="720" y2="500" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="220" y="520" text-anchor="middle" fill="#807e76" font-size="11">148.1M km from Sun</text>
  <text x="540" y="520" text-anchor="middle" fill="#807e76" font-size="11">1.5M km from Earth</text>

  <text x="450" y="565" text-anchor="middle" fill="#5f5e5a" font-size="11">Individual sail units are gram-to-kilogram scale — the shading effect comes from swarm coverage, not structural mass</text>
</svg>
